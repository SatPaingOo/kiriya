version: 2

# kiriya ships no runtime dependency, so everything here is a development one: the compiler,
# the linter, the formatter and the MCP client the tests check the server against. An advisory
# in one of them cannot reach anyone who installed kiriya, but it should not sit unnoticed
# either, which is what happened before this file existed.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      # One pull request a week for the small moves, so they are read once and merged once.
      development:
        patterns: ["*"]
        update-types: [minor, patch]
    # A major version of TypeScript or @types/node changes what compiles, so it arrives on
    # its own and is read on its own.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
