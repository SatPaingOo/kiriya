version: 2

# kiriya ships no runtime dependency, so everything here is a development one: the compiler,
# the linter, the formatter and the MCP client the tests check the server against. An advisory
# in one of them cannot reach anyone who installed kiriya, but it should not sit unnoticed
# either, which is what happened before this file existed.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      # One pull request a week for the small moves, so they are read once and merged once.
      development:
        patterns: ["*"]
        update-types: [minor, patch]
    # A major version of the compiler changes what compiles, so it arrives on its own and is
    # read on its own.
    ignore:
      # @types/node must describe the oldest Node kiriya supports, which `engines` puts at
      # 22.13. On a newer major, code calling an API that exists only in Node 24 or 26
      # compiles and then fails on the Node 22 the readme promises, and CI catches that only
      # where a test happens to exercise the path. This ignore comes off in the same change
      # that raises the floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
