name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Every OS on every Node.js version (macOS minutes cost about ten times Linux ones)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · format · types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Check what the npm package would contain
        run: |
          npm pack --dry-run --json > pack.json
          node dist/tools/check-package.js pack.json
      - name: Check server.json, which the MCP Registry reads, against package.json
        run: node dist/tools/check-server.js
      - name: Check the docs against the CLI, and every link in them
        run: node dist/tools/docs.js --check

  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # Public, or "Run workflow" with full: every OS on every Node.js version.
        # Private: Linux and Windows on Node 22, because private minutes are limited and macOS costs ten times more.
        os: ${{ fromJSON((inputs.full || !github.event.repository.private) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        node: ${{ fromJSON((inputs.full || !github.event.repository.private) && '["22","24","current"]' || '["22"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      KIRIYA_TEST_REAL_TRASH: "1"
      KIRIYA_TEST_REAL_CLIPBOARD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test
